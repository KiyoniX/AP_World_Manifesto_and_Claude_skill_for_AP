name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: manifesto
          path: dist

      # Each document is attached as is: no archive around them.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AP_World_Manifesto.pdf dist/AP_World_Manifesto.docx \
            dist/AP_World_Manifesto.md --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
